plugins {
    id 'com.android.application'
}

// Read private values (Maps key, API address) from local.properties, which is not committed
def localProps = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) {
    localFile.withInputStream { localProps.load(it) }
}

android {
    namespace 'com.solargrid.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.solargrid.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'

        // 10.0.2.2 is the emulator's address for "localhost" on your PC
        buildConfigField 'String', 'API_BASE_URL',
                "\"${localProps.getProperty('API_BASE_URL', 'http://10.0.2.2:5080/api/')}\""

        // Google Maps key is inserted into AndroidManifest.xml
        manifestPlaceholders = [MAPS_API_KEY: localProps.getProperty('MAPS_API_KEY', '')]
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Android UI
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // REST API calls (Retrofit + Gson for JSON)
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'

    // Google Maps + location (Member 3)
    implementation 'com.google.android.gms:play-services-maps:19.0.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // QR code generate + scan (Member 3 and Member 4)
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
